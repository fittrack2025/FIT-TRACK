{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Post</title>
    <link rel="stylesheet" href="{% static 'css/managepost.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        .description {
            font-size: 0.85em;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .add-button {
            margin-bottom: 15px;
        }
        .actions {
            white-space: nowrap;
            display: flex;
            gap: 10px;
        }
        .rounded-table {
            border-radius: 10px; /* Add rounded edges */
            overflow: hidden; /* Ensure borders stay rounded */
        }
    </style>
</head>
<body class="body">
    <div class="container mt-3">
        <!-- Add button at the top -->
        <a href="/Addpost" class="btn btn-primary add-button">ADD</a>

        <!-- Table for posts -->
        <div class="table-responsive rounded-table">
            <table class="table table-dark table-striped m-0">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Video</th>
                        <th scope="col">Description</th>
                        <th scope="col">Day</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in val %}
                    <tr>
                        <td>{{ i.name }}</td>
                        <td>
                            <video controls width="200" height="120">
                                <source src="{{ i.videos.url }}" type="video/mp4">
                            </video>
                        </td>
                        <td class="description">{{ i.description }}</td>
                        <td>{{ i.workoutday }}</td>
                        <td>
                            <!-- Actions -->
                            <div class="actions">
                                <a href="/Editpost/{{ i.id }}" class="btn btn-success btn-sm">Edit</a>
                                <a href="/deletep/{{ i.id }}" class="btn btn-danger btn-sm">Delete</a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
