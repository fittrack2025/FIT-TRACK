{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage podt</title>
    <link rel="stylesheet" href="{% static 'css/verify.css' %}">

</head>
<body>
    
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <!-- Name Field -->
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" value="{{val.name}}" required><br><br>

        <!-- Video Field -->
        <label for="video">Video:</label><br>
        <input type="file" id="video" name="video" accept="video/*" ><br><br>
        <video  controls>
            <source src="{{val.video.url}}" type="video/mp4">
        </video>

        <label for="type">type</label><br>
        <select name="type">
            <option value="{{val.type}}" {% if val.type == "upperbody" %}selected{% endif %}>Upper Body</option>
            <option value="{{val.type}}" {% if val.type == "lowerbody" %}selected{% endif %}>Lower Body</option>
            <option value="{{val.type}}" {% if val.type == "abs" %}selected{% endif %}>Abs</option>
        </select>
        
        <label for="day">day</label><br>
        <select name="workoutday">
            <option value="1" {% if val.workoutday == "1" %}selected{% endif %}>1</option>
            <option value="2" {% if val.workoutday == "2" %}selected{% endif %}>2</option>
            <option value="3" {% if val.workoutday == "3" %}selected{% endif %}>3</option>
            <option value="4" {% if val.workoutday == "4" %}selected{% endif %}>4</option>
            <option value="5" {% if val.workoutday == "5" %}selected{% endif %}>5</option>
            <option value="6" {% if val.workoutday == "6" %}selected{% endif %}>6</option>
            <option value="7" {% if val.workoutday == "7" %}selected{% endif %}>7</option>
            <option value="8" {% if val.workoutday == "8" %}selected{% endif %}>8</option>
            <option value="9" {% if val.workoutday == "9" %}selected{% endif %}>9</option>
            <option value="10" {% if val.workoutday == "10" %}selected{% endif %}>10</option>
            <option value="11" {% if val.workoutday == "11" %}selected{% endif %}>11</option>
            <option value="12" {% if val.workoutday == "12" %}selected{% endif %}>12</option>
            <option value="13" {% if val.workoutday == "13" %}selected{% endif %}>13</option>
            <option value="14" {% if val.workoutday == "14" %}selected{% endif %}>14</option>
            <option value="15" {% if val.workoutday == "15" %}selected{% endif %}>15</option>
            <option value="16" {% if val.workoutday == "16" %}selected{% endif %}>16</option>
            <option value="17" {% if val.workoutday == "17" %}selected{% endif %}>17</option>
            <option value="18" {% if val.workoutday == "18" %}selected{% endif %}>18</option>
            <option value="19" {% if val.workoutday == "19" %}selected{% endif %}>19</option>
            <option value="20" {% if val.workoutday == "20" %}selected{% endif %}>20</option>
            <option value="21" {% if val.workoutday == "21" %}selected{% endif %}>21</option>
            <option value="22" {% if val.workoutday == "22" %}selected{% endif %}>22</option>
            <option value="23" {% if val.workoutday == "23" %}selected{% endif %}>23</option>
            <option value="24" {% if val.workoutday == "24" %}selected{% endif %}>24</option>
            <option value="25" {% if val.workoutday == "25" %}selected{% endif %}>25</option>
            <option value="26" {% if val.workoutday == "26" %}selected{% endif %}>26</option>
            <option value="27" {% if val.workoutday == "27" %}selected{% endif %}>27</option>
            <option value="28" {% if val.workoutday == "28" %}selected{% endif %}>28</option>
            <option value="29" {% if val.workoutday == "29" %}selected{% endif %}>29</option>
            <option value="30" {% if val.workoutday == "30" %}selected{% endif %}>30</option>
        </select>
        
        


        <!-- Description Field -->
        <label for="description">Description:</label><br>
        <textarea id="description" name="description" rows="4" cols="50" required>{{val.description}}</textarea><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Update">
    </form>
    
</body>
</html>
